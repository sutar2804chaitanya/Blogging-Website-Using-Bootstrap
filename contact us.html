<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chaitanya Sutar | Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info fs-3" href="index.html">Chaitanya Sutar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-uppercase" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-uppercase" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link text-uppercase" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link active text-uppercase" href="contact us.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h2 class="fw-bold text-info m-0">Get In Touch</h2>
                        <p class="fst-italic text-light opacity-75 m-0 pt-1">Let's discuss coding, gaming, or engineering!</p>
                    </div>
                    <div class="card-body p-5 bg-white">
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">First Name</label>
                                    <input type="text" class="form-control bg-light border-secondary" placeholder="John">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Last Name</label>
                                    <input type="text" class="form-control bg-light border-secondary" placeholder="Doe">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Email Address</label>
                                <input type="email" class="form-control bg-light border-secondary" placeholder="name@example.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">Message</label>
                                <textarea class="form-control bg-light border-secondary" rows="5" placeholder="How can I help you?"></textarea>
                            </div>
                            <button class="btn btn-info btn-lg w-100 fw-bold text-dark" type="submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-center py-4 mt-auto">
        <span class="text-light opacity-75">© 2026 Chaitanya Sutar</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
